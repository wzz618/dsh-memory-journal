[project]
name = "dsh-memory-journal"
version = "0.1.1"
description = "轻量日记式长期记忆 MCP server：提供 memory_search/memory_get/memory_write/memory_weeks_missing_journal 等显式检索、写入与日记工具，配合 js-shell 的自动注入与设置页使用。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
dsh-memory-journal = "dsh_memory_journal.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_memory_journal"]
